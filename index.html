<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cascadia Simplified</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Cascadia Simplified</h1>

    <div id="game-container">
        <!-- The active player's board -->
        <div id="board" role="group" aria-label="Your habitat board"></div>

        <!-- Draft, scores, turn info, and controls -->
        <div id="sidebar">
            <h2 id="turn-heading">Player 1's Turn</h2>

            <div id="scores" aria-live="polite">
                <span class="score-tag" data-player="0">Player 1: 0</span>
                <span class="score-tag" data-player="1">Player 2: 0</span>
            </div>

            <p id="status" role="status" aria-live="polite"></p>

            <h2>Draft</h2>
            <div id="draft-area"></div>

            <button id="end-turn" type="button">End Turn (Pass)</button>
            <button id="new-game" type="button">New Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
